[workspace]
members = [
    "crates/core",
    "crates/wasm",
    "crates/cli",
]
resolver = "2"

[workspace.package]
repository = "https://github.com/Innovgame/slicer-converter"
homepage = "https://innovgame.github.io/slicer-converter/"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
