[package]
name = "slicer-converter-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for slicer-converter"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--all-features"]

[lib]
name = "slicer_converter_wasm"
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
slicer-converter-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3", features = ["Performance", "Window"] }
