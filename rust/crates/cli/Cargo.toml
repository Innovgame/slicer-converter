[package]
name = "slicer-converter-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line slicer format converter"
license = "MIT"

[[bin]]
name = "slicer-converter"
path = "src/main.rs"
bench = false

[dependencies]
slicer-converter-core = { path = "../core" }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
