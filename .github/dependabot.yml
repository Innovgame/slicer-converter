version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
    - package-ecosystem: cargo
      directory: /rust
      schedule:
          interval: weekly
      ignore:
          - dependency-name: aes
            update-types:
                - version-update:semver-major
          - dependency-name: cbc
            update-types:
                - version-update:semver-minor
                - version-update:semver-major
          - dependency-name: criterion
            update-types:
                - version-update:semver-major
