name: Release

permissions:
    contents: write
    packages: write

on:
    push:
        tags:
            - v*
    workflow_dispatch:
        inputs:
            tag:
                description: Existing tag to publish
                required: true
                default: v0.1.2
                type: string

jobs:
    build:
        name: ${{ matrix.asset_name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      asset_name: slicer-converter-windows-x86_64.exe
                      binary_name: slicer-converter.exe
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      asset_name: slicer-converter-linux-x86_64
                      binary_name: slicer-converter
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-musl
                      asset_name: slicer-converter-linux-x86_64-musl
                      binary_name: slicer-converter
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      asset_name: slicer-converter-macos-aarch64
                      binary_name: slicer-converter
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Install musl tools
              if: matrix.target == 'x86_64-unknown-linux-musl'
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Build CLI
              working-directory: rust
              run: cargo build --release --target ${{ matrix.target }} -p slicer-converter-cli

            - name: Collect asset
              shell: bash
              run: cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.asset_name }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.asset_name }}
                  path: ${{ matrix.asset_name }}
                  if-no-files-found: error

    release:
        name: Publish
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s nullglob
                  cd dist
                  binaries=(slicer-converter-*)
                  if [ ${#binaries[@]} -eq 0 ]; then
                      echo "No release assets found" >&2
                      exit 1
                  fi
                  sha256sum "${binaries[@]}" > SHA256SUMS
                  tag="${{ github.event.inputs.tag || github.ref_name }}"
                  gh release create "$tag" "${binaries[@]}" SHA256SUMS \
                      --repo "${GITHUB_REPOSITORY}" \
                      --title "$tag" \
                      --notes "Binaries built from ${GITHUB_SHA}. Includes Windows x64, Linux glibc x64, Linux musl x64, and macOS Apple Silicon. Intel macOS builds from source. Verify downloads with SHA256SUMS. @innovgame/slicer-converter is published to GitHub Packages by this workflow. See CHANGELOG.md."

    github-packages:
        name: GitHub Packages
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.tag || github.sha }}

            - uses: ./.github/actions/setup-toolchain
              with:
                  wasm: true
                  build-wasm: true
                  cache-key: cargo-github-packages

            - name: Publish package
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: bash scripts/publish-npm-package.sh
