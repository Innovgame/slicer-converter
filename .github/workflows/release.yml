name: Release

on:
    push:
        tags:
            - v*

permissions:
    contents: write

jobs:
    build:
        name: ${{ matrix.asset_name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      asset_name: slicer-converter-windows-x86_64.exe
                      binary_name: slicer-converter.exe
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      asset_name: slicer-converter-linux-x86_64
                      binary_name: slicer-converter
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-musl
                      asset_name: slicer-converter-linux-x86_64-musl
                      binary_name: slicer-converter
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      asset_name: slicer-converter-macos-aarch64
                      binary_name: slicer-converter
                    - os: macos-13
                      target: x86_64-apple-darwin
                      asset_name: slicer-converter-macos-x86_64
                      binary_name: slicer-converter
        steps:
            - uses: actions/checkout@v5

            - name: Install musl tools
              if: matrix.target == 'x86_64-unknown-linux-musl'
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Build CLI
              working-directory: rust
              run: cargo build --release --target ${{ matrix.target }} -p slicer-converter-cli

            - name: Collect asset
              shell: bash
              run: cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.asset_name }}"

            - uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.asset_name }}
                  path: ${{ matrix.asset_name }}
                  if-no-files-found: error

    release:
        name: Publish
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s nullglob
                  cd dist
                  binaries=(slicer-converter-*)
                  if [ ${#binaries[@]} -eq 0 ]; then
                      echo "No release assets found" >&2
                      exit 1
                  fi
                  sha256sum "${binaries[@]}" > SHA256SUMS
                  gh release create "${GITHUB_REF_NAME}" "${binaries[@]}" SHA256SUMS \
                      --repo "${GITHUB_REPOSITORY}" \
                      --title "${GITHUB_REF_NAME}" \
                      --notes "Binaries built from ${GITHUB_SHA}. Includes Windows x64, Linux glibc x64, Linux musl x64, macOS Apple Silicon, and macOS Intel. Verify downloads with SHA256SUMS. npm and crates.io packages are not published. See CHANGELOG.md."
