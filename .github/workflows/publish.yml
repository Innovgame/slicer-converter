name: Publish packages

on:
    workflow_dispatch:
    release:
        types: [published]

jobs:
    crates:
        name: crates.io
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - name: Publish crates
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: |
                  if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
                      echo "CARGO_REGISTRY_TOKEN is not set. Skipping crates.io publish."
                      exit 0
                  fi
                  cargo publish --manifest-path rust/Cargo.toml -p slicer-converter-core
                  cargo publish --manifest-path rust/Cargo.toml -p slicer-converter-cli
                  cargo publish --manifest-path rust/Cargo.toml -p slicer-converter-wasm

    npm:
        name: GitHub Packages
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name || github.ref }}

            - uses: ./.github/actions/setup-toolchain
              with:
                  wasm: true
                  build-wasm: true
                  cache-key: cargo-npm

            - name: Check package version
              if: github.event_name == 'release'
              run: |
                  tag="${{ github.event.release.tag_name }}"
                  version="$(node -p "require('./packages/slicer-wasm/package.json').version")"
                  if [ "$tag" != "v$version" ]; then
                      echo "Tag $tag does not match @innovgame/slicer-converter version $version" >&2
                      exit 1
                  fi

            - name: Publish to GitHub Packages
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  printf '%s\n' "@innovgame:registry=https://npm.pkg.github.com" "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
                  npm publish --ignore-scripts
              working-directory: packages/slicer-wasm
