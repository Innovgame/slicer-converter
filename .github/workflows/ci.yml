name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: lint
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-toolchain
              with:
                  rust: false
                  cache-key: unused

            - name: Run lint
              run: pnpm lint

            - name: Run format check
              run: pnpm format:check

    rust:
        name: rust
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-toolchain
              with:
                  node: false
                  components: rustfmt,clippy
                  cache-key: cargo-rust

            - name: Check Rust formatting
              working-directory: rust
              run: cargo fmt --check

            - name: Run Clippy
              run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

            - name: Run Rust tests
              run: cargo test --manifest-path rust/Cargo.toml --workspace

            - name: Setup Node for benchmark gate
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Run benchmark threshold gate
              run: node scripts/check-benchmark-threshold.mjs

    app:
        name: app
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-toolchain
              with:
                  wasm: true
                  build-wasm: true
                  cache-key: cargo-wasm

            - name: Run typecheck
              run: pnpm typecheck

            - name: Verify public package initialization
              run: |
                  node scripts/smoke-package.mjs
                  node scripts/smoke-package.mjs progress

            - name: Run WASM package unit tests
              run: pnpm test:wasm:unit

            - name: Run app unit coverage
              run: pnpm test:app:coverage

            - name: Run script tests
              run: pnpm test:scripts

            - name: Upload app coverage
              uses: actions/upload-artifact@v7
              with:
                  name: app-coverage-html
                  path: apps/slicer-app/coverage
                  if-no-files-found: error

    wasm:
        name: wasm
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-toolchain
              with:
                  wasm: true
                  cache-key: cargo-wasm-pack

            - name: Run wasm-pack node tests
              run: pnpm test:wasm

    e2e:
        name: e2e
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-toolchain
              with:
                  wasm: true
                  build-wasm: true
                  cache-key: cargo-wasm-e2e

            - name: Configure Ubuntu dependency downloads
              run: |
                  sources=/etc/apt/sources.list.d/ubuntu.sources
                  if [ -f "$sources" ]; then
                      sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
                  fi
                  sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
                  Acquire::Retries "3";
                  Acquire::http::Timeout "30";
                  Acquire::https::Timeout "30";
                  EOF

            - name: Install Playwright system dependencies
              timeout-minutes: 10
              run: pnpm --filter @slicer-converter/slicer-app exec playwright install-deps chromium firefox

            - name: Install Playwright browsers
              timeout-minutes: 10
              env:
                  PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
              run: pnpm --filter @slicer-converter/slicer-app exec playwright install chromium firefox

            - name: Run browser e2e
              run: pnpm test:app:e2e
